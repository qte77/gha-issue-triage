# Self-triage: dogfoods the action by triaging every new/edited issue in
# this repo. Side effects: labels may be added; one sticky summary comment
# is posted (or edited on re-runs).
#
# Label-application by the action uses secrets.GITHUB_TOKEN, so the
# resulting `issues: labeled` events do NOT trigger this workflow again
# (GitHub blocks re-triggering from default-token actions). No loop risk.
name: Self-triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@dc115f9223884fd0eb94d084287320c4157cf91b  # v0.7.1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path B (OpenAI-compatible) via Cloudflare Workers AI. Requires
          # repo secrets CF_WORKERS_AI_TOKEN and LLM_BASE_URL (a secret keeps
          # the account id in the URL out of logs).
          llm-api-key: ${{ secrets.CF_WORKERS_AI_TOKEN }}
          api_base: ${{ secrets.LLM_BASE_URL }}
          MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          # Shadow mode: also ask the decision-shaped questions through decide()
          # (Clef) and append value/probability/band to the comment. Never sets
          # labels; this repo's own issues double as calibration data.
          decide-shadow: "true"
