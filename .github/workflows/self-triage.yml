# Self-triage: dogfoods the action by triaging every new/edited issue in
# this repo. Side effects: labels may be added; one sticky summary comment
# is posted (or edited on re-runs).
#
# Label-application by the action uses secrets.GITHUB_TOKEN, so the
# resulting `issues: labeled` events do NOT trigger this workflow again
# (GitHub blocks re-triggering from default-token actions). No loop risk.
name: Self-triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@1bf71f215a70a9b19f228e1c190aaf578baa6a59  # v0.4.0
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path B (OpenAI-compatible) via Cloudflare Workers AI. Requires
          # repo secret CF_WORKERS_AI_TOKEN (owner must set it); variable
          # LLM_BASE_URL is already configured as of 2026-10-10.
          llm-api-key: ${{ secrets.CF_WORKERS_AI_TOKEN }}
          api_base: ${{ vars.LLM_BASE_URL }}
          MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
