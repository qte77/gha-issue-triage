# Self-triage: dogfoods the action by triaging every new/edited issue in
# this repo. Side effects: labels may be added; one sticky summary comment
# is posted (or edited on re-runs).
#
# Label-application by the action uses secrets.GITHUB_TOKEN, so the
# resulting `issues: labeled` events do NOT trigger this workflow again
# (GitHub blocks re-triggering from default-token actions). No loop risk.
name: Self-triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  models: read
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@1bf71f215a70a9b19f228e1c190aaf578baa6a59  # v0.4.0
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # llm-api-key / api_base omitted → action falls back to the
          # retired GitHub Models default, which now returns HTTP 410 on
          # every call (posts a `github-models-retired` failure comment).
          # This repo has no LLM provider secret configured yet; tracked
          # as a known follow-up rather than fixed here. See
          # docs/integrations.md Path B for the migration.
