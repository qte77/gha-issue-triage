# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
name: "AI Issue Triage"
description: "AI-powered issue triage. Detects duplicates, scores relevance, analyzes feasibility, auto-labels, posts sticky summary."
author: "qte77"
branding:
  icon: "tag"
  color: "purple"
inputs:
  GH_TOKEN:
    description: "GitHub token for gh CLI (issue/label API calls). Never used as the LLM bearer."
    required: true
  api_base:
    description: "Base URL of an OpenAI-compatible Chat Completions endpoint (Cloudflare Workers AI, Mistral, Cerebras, Ollama, vLLM, ...); the action appends /chat/completions. Takes precedence over ANTHROPIC_API_KEY and the retired GitHub Models default when set. llm-api-key is sent as Bearer; MODEL selects the model."
    default: ""
  llm-api-key:
    description: "Bearer token for the LLM backend selected by api_base (or GitHub Models when api_base is unset). Falls back to the deprecated AI_TOKEN input, then github.token, for backward compatibility. Never used for gh CLI calls -- use GH_TOKEN for that."
    default: ""
  MODEL:
    description: "LLM model ID. Default is a GitHub Models catalog ID (retired backend); set to a provider-specific model ID when api_base is set, e.g. @cf/meta/llama-3.3-70b-instruct-fp8-fast for Cloudflare Workers AI."
    default: "openai/gpt-4.1"
  ANTHROPIC_API_KEY:
    description: "Anthropic API key (native Messages API backend)."
    default: ""
  OPENAI_API_BASE:
    description: "Deprecated alias for api_base. Prefer api_base."
    default: ""
  AI_TOKEN:
    description: "Deprecated alias for llm-api-key. Prefer llm-api-key. Default (github.token) is only valid for the retired GitHub Models backend."
    default: ${{ github.token }}
  MAX_DUPLICATES:
    description: "Max duplicate candidates to check."
    default: "10"
  SIMILARITY_THRESHOLD:
    description: "Fuzzy match threshold 0-1."
    default: "0.6"
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 1
        token: ${{ inputs.GH_TOKEN }}

    - name: Setup uv
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock

    - name: Run issue triage
      shell: bash
      # All caller inputs flow through env: (referenced as $VAR in run:) rather
      # than ${{ inputs.* }} interpolated into the shell — prevents command
      # injection when an input value contains shell metacharacters.
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        # api_base / llm-api-key are the canonical names; OPENAI_API_BASE /
        # AI_TOKEN are deprecated aliases kept for backward compatibility.
        API_BASE: ${{ inputs.api_base || inputs.OPENAI_API_BASE }}
        LLM_API_KEY: ${{ inputs.llm-api-key || inputs.AI_TOKEN }}
        MODEL: ${{ inputs.MODEL }}
        ANTHROPIC_API_KEY: ${{ inputs.ANTHROPIC_API_KEY }}
        MAX_DUPLICATES: ${{ inputs.MAX_DUPLICATES }}
        SIMILARITY_THRESHOLD: ${{ inputs.SIMILARITY_THRESHOLD }}
        PYTHONPATH: ${{ github.action_path }}/src
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/.venv
      run: |
        uv sync --frozen --no-dev --project "${{ github.action_path }}"
        uv run --project "${{ github.action_path }}" python "${{ github.action_path }}/src/app.py"
