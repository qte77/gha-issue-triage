---
name: Tag Release

# Tags v{version} when a merge to main changes the version in pyproject.toml.
# No-op when pyproject.toml changed without a version bump; never deletes or
# overwrites a tag (see qte77/.github#23). Publish Release chains off this run.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
...
