# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
name: "AI Issue Triage"
description: "AI-powered issue triage. Detects duplicates, scores relevance, analyzes feasibility, auto-labels, posts sticky summary."
author: "qte77"
branding:
  icon: "tag"
  color: "purple"
inputs:
  GH_TOKEN:
    description: "GitHub token for gh CLI (issue/label API calls). Never used as the LLM bearer."
    required: true
  api_base:
    description: "Base URL of an OpenAI-compatible Chat Completions endpoint (Cloudflare Workers AI, Mistral, Cerebras, Ollama, vLLM, ...); the action appends /chat/completions. Takes precedence over ANTHROPIC_API_KEY and the retired GitHub Models default when set. llm-api-key is sent as Bearer; MODEL selects the model."
    default: ""
  llm-api-key:
    description: "Bearer token for the LLM backend selected by api_base (or GitHub Models when api_base is unset). Falls back to the deprecated AI_TOKEN input, then github.token, for backward compatibility. Never used for gh CLI calls -- use GH_TOKEN for that."
    default: ""
  MODEL:
    description: "LLM model ID. Default is a GitHub Models catalog ID (retired backend); set to a provider-specific model ID when api_base is set, e.g. @cf/meta/llama-3.3-70b-instruct-fp8-fast for Cloudflare Workers AI."
    default: "openai/gpt-4.1"
  ANTHROPIC_API_KEY:
    description: "Anthropic API key (native Messages API backend)."
    default: ""
  OPENAI_API_BASE:
    description: "Deprecated alias for api_base. Prefer api_base."
    default: ""
  AI_TOKEN:
    description: "Deprecated alias for llm-api-key. Prefer llm-api-key. Default (github.token) is only valid for the retired GitHub Models backend."
    default: ${{ github.token }}
  MAX_DUPLICATES:
    description: "Max duplicate candidates to check."
    default: "10"
  SIMILARITY_THRESHOLD:
    description: "Fuzzy match threshold 0-1."
    default: "0.6"
  decide-shadow:
    description: >-
      When "true", additionally asks the triage's decision-shaped questions
      (relevance relevant/category/score, feasibility feasible/complexity/effort)
      through the shared qte77/.github decide() gate and appends the calibrated
      probabilities to the sticky summary comment. Shadow only: never sets labels
      or changes the existing analysis. Default off.
    default: "false"
  decide-backend:
    description: >-
      decide() backend used when decide-shadow is "true": "clef" (Cloudflare
      Workers AI's Clef model, calibrated -- reuses api_base/llm-api-key, no new
      secret), "jev" (TypeSafe, needs typesafe-api-key), or "cf" (uncalibrated
      OpenAI-compatible fallback).
    default: "clef"
  decide-model:
    description: >-
      Model passed to decide() when decide-shadow is "true". For backend "clef":
      "clef" or "clef-flash".
    default: "clef"
  decide-hi:
    description: >-
      decide() confidence threshold (0-1) banding an answer "act" when
      decide-shadow is "true". Shadow mode never acts on it -- reported for
      calibration only.
    default: "0.75"
  typesafe-api-key:
    description: >-
      TypeSafe API key, used only when decide-shadow is "true" and
      decide-backend is "jev". The api_base/llm-api-key credentials are never
      sent to the jev backend.
    default: ""
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1
        token: ${{ inputs.GH_TOKEN }}

    # Only runs when decide-shadow is enabled, so the default path's checkout
    # footprint is unchanged. Checked out under $GITHUB_WORKSPACE (a second
    # path outside it is rejected by actions/checkout) as ".decide-gate" --
    # excluded from feasibility.py's codebase listing (src/feasibility.py) so
    # it never pollutes that LLM prompt.
    - name: Checkout decide() gate (shadow mode only)
      if: ${{ inputs.decide-shadow == 'true' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        repository: qte77/.github
        ref: 43ad1211e962f82fab823377dcc7272054d8196c
        path: .decide-gate
        sparse-checkout: actions/decide
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock

    - name: Run issue triage
      shell: bash
      # All caller inputs flow through env: (referenced as $VAR in run:) rather
      # than ${{ inputs.* }} interpolated into the shell — prevents command
      # injection when an input value contains shell metacharacters.
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        # api_base / llm-api-key are the canonical names; OPENAI_API_BASE /
        # AI_TOKEN are deprecated aliases kept for backward compatibility.
        API_BASE: ${{ inputs.api_base || inputs.OPENAI_API_BASE }}
        LLM_API_KEY: ${{ inputs.llm-api-key || inputs.AI_TOKEN }}
        MODEL: ${{ inputs.MODEL }}
        ANTHROPIC_API_KEY: ${{ inputs.ANTHROPIC_API_KEY }}
        MAX_DUPLICATES: ${{ inputs.MAX_DUPLICATES }}
        SIMILARITY_THRESHOLD: ${{ inputs.SIMILARITY_THRESHOLD }}
        DECIDE_SHADOW: ${{ inputs.decide-shadow }}
        DECIDE_BACKEND: ${{ inputs.decide-backend }}
        DECIDE_MODEL: ${{ inputs.decide-model }}
        DECIDE_HI: ${{ inputs.decide-hi }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        DECIDE_MODULE_PATH: ${{ inputs.decide-shadow == 'true' && format('{0}/.decide-gate/actions/decide/decide.py', github.workspace) || '' }}
        PYTHONPATH: ${{ github.action_path }}/src
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/.venv
      run: |
        uv sync --frozen --no-dev --project "${{ github.action_path }}"
        uv run --project "${{ github.action_path }}" python "${{ github.action_path }}/src/app.py"
