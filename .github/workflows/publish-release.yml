---
name: Publish Release

# Cuts the GitHub Release (notes from the CHANGELOG.md ## [version] block) right
# after Tag Release tags a bump. Chained via workflow_run because a tag pushed
# with GITHUB_TOKEN does not trigger other workflows. Never overwrites an
# existing Release (see qte77/.github#23).

on:
  # zizmor: ignore[dangerous-triggers] -- workflow_run is required (a tag pushed with
  # GITHUB_TOKEN does not trigger other workflows, see above). The resolve job only
  # proceeds for a successful Tag Release run triggered by a push in this repository
  # (event == push and head_repository == this repository), checks out no code and runs
  # with contents read; publish runs only after resolve succeeds and finds a v* tag of
  # this repository on that commit, and only it holds contents write.
  workflow_run:
    workflows: [Tag Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: latest v* tag)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    # Tag Release also runs (and succeeds) for pyproject.toml changes without a
    # version bump; only publish when a v* tag points at the commit it ran on.
    # Only a successful Tag Release run triggered by a push in this repository counts.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the v* tag on the Tag Release commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '[.[] | select(.commit.sha == env.HEAD_SHA and (.name | startswith("v"))) | .name][0] // ""')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag on ${HEAD_SHA}: ${TAG:-none}"

  publish:
    needs: resolve
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.resolve.result == 'success' && needs.resolve.outputs.tag != ''))
    uses: qte77/.github/.github/workflows/publish-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    with:
      tag: ${{ inputs.tag || needs.resolve.outputs.tag }}
    permissions:
      contents: write
...
